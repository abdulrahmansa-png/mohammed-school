  const w=cards[i];miss=false;q('#sc').innerHTML=`${picHTML(w,'xl')}<div class="enword en">${esc(w.en)}</div>${enOK()?'<button class="say-btn" id="sr">🔊 اسمع</button>':''}`;if(enOK()){speakEn(w.en);q('#sr').onclick=()=>speakEn(w.en);}};
 drawBins();next();}
function gTFRun(root,L){const acts=EN.find(x=>x.id==='u3c').items.concat(L.items.filter(x=>x.set==='s').map(x=>({en:x.en.replace(/^I'm /,'').replace('.',''),ar:x.ar,pic:x.pic})));let r=0,sc=0,miss=false,truth;
 root.innerHTML=`<div class="panel act"><h2>🏃 اركض إلى T أو F</h2><div>انظر إلى الصورة واستمع. إذا كانت الجملة صحيحة اركض إلى <b class="en">T</b>، وإذا كانت خاطئة اركض إلى <b class="en">F</b>.</div><div class="tfpic" id="tp"></div><div class="tfzones"><button class="tfz t" data-v="1"><span class="en">T</span><small class="en">True</small></button><button class="tfz f" data-v="0"><span class="en">F</span><small class="en">False</small></button></div><div class="msg" id="tm2"></div></div>`;
 const q=s=>root.querySelector(s);
 const round=()=>{if(!root.isConnected)return;if(r>=8){q('#tp').innerHTML='<span class="pic xl">🏅</span>';q('#tm2').className='msg ok pop';q('#tm2').textContent=`${ar(sc)} من ٨ من أول محاولة!`;if(sc>=6){sWin();confetti();}return;}
  const w=pick(acts);truth=Math.random()<.5;const c=truth?w:pick(acts.filter(x=>x.pic!==w.pic));const s=`I'm ${c.en}.`;miss=false;q('#tp').innerHTML=`${picHTML(w,'xl')}<div class="sbub"><span class="en">${esc(s)}</span>${enOK()?' <button class="say-btn" id="tr2">🔊</button>':''}</div>`;if(enOK()){speakEn(s);q('#tr2').onclick=()=>speakEn(s);}q('#tm2').textContent='';};
 root.querySelectorAll('.tfz').forEach(b=>b.onclick=()=>{const v=b.dataset.v==='1';if(v===truth){if(!miss)sc++;sGood();speakEn(v?"I think it's true.":"I think it's false.",false,1.2);q('#tm2').className='msg ok pop';q('#tm2').innerHTML=`<span class="en">${v?"I think it's true.":"I think it's false."}</span>`;r++;setTimeout(round,1300);}else{miss=true;sBad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);}});
 round();}
function gWindows(root,L){const ppl=[['👨','He\'s','أبي'],['👩','She\'s','أمي'],['👦','He\'s','أخي'],['👧','She\'s','أختي'],['👴','He\'s','جدي'],['👵','She\'s','جدتي']];const acts=shuffle(L.items);const win=ppl.map((p,k)=>({p,a:acts[k]}));const order=shuffle(win.map((_,k)=>k));let i=0,sc=0,miss=false;const found=[];
 root.innerHTML=`<div class="panel act"><h2>🏠 نوافذ البيت</h2><div>ماذا تفعل العائلة؟ استمع للجملة واضغط على النافذة الصحيحة.</div><div class="target" id="wq"></div><div class="home3"><div class="roof"></div><div class="wins" id="ws"></div></div><div class="msg" id="wm"></div></div>`;
 const q=s=>root.querySelector(s);
 const draw=()=>{q('#ws').innerHTML=win.map((w,k)=>`<button class="win${found.includes(k)?' ok':''}" data-k="${k}"><span class="pic big">${w.p[0]}</span>${picHTML(w.a,'mini')}<small>${w.p[2]}</small></button>`).join('');
  root.querySelectorAll('.win').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,t=order[i];if(t==null)return;if(k===t){if(!miss)sc++;sGood();found.push(k);i++;draw();setTimeout(round,600);}else{miss=true;sBad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);}});};
 const round=()=>{if(!root.isConnected)return;if(i>=order.length){q('#wq').innerHTML='<span class="big-eq">عرفت ماذا يفعل الجميع! 🎉</span>';q('#wm').className='msg ok pop';q('#wm').textContent=`${ar(sc)} من ٦ من أول محاولة.`;sWin();confetti();return;}
  const w=win[order[i]];miss=false;const s=`${w.p[1]} ${w.a.en.replace('my homework',w.p[1]==="He's"?'his homework':'her homework')}.`;q('#wq').innerHTML=`<span class="en enq" style="font-size:24px">${esc(s)}</span> ${enOK()?'<button class="say-btn" id="wr">🔊</button>':''}`;if(enOK()){speakEn(s);q('#wr').onclick=()=>speakEn(s);}q('#wm').textContent='';};
 draw();round();}
const EN_GAME={i0:(r,L)=>gRole(r,L,'class','c'),u1a:(r,L)=>gRole(r,L,'park','b'),u1b:gLineup,u1c:gHelp,u1d:gMagicE,u2a:gLost,u2b:gPaint,u2c:gDress,u2d:gSort,u3a:(r,L)=>gRole(r,L,'phone','b'),u3b:gTFRun,u3c:gWindows,u3d:gSort};
function memoryGame(el,L){const pool=pics(L).filter(w=>!w.pic.startsWith('txt:')||L.id==='u1b');const ch=shuffle(pool).slice(0,Math.min(6,pool.length));let cards=shuffle(ch.flatMap(w=>[{w,t:'p'},{w,t:'w'}])),open=[],done=0,moves=0,lock=false;
 el.innerHTML=`<div class="panel act"><h2>🃏 لعبة الذاكرة</h2><div>اقلب بطاقتين: صورة والكلمة التي تناسبها.</div><div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" aria-label="بطاقة"><span class="mback"><svg viewBox="0 0 40 40" width="60%" aria-hidden="true"><polygon points="20,3 25,15 38,15 27.5,23 31.5,36 20,28 8.5,36 12.5,23 2,15 15,15" fill="#FFFFFF" fill-opacity=".9"/></svg></span><span class="front">${c.t==='p'?picHTML(c.w,'mem-pic'):`<span class="en">${esc(c.w.en)}</span>`}</span></button>`).join('')}</div><div class="msg" id="mmm"></div><button class="btn alt" id="mnew">لعبة جديدة</button></div>`;
 el.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up'))return;const c=cards[+b.dataset.k];b.classList.add('up');open.push([b,c]);speakEn(c.w.en);
  if(open.length===2){moves++;const[[b1,c1],[b2,c2]]=open;open=[];if(c1.w.en===c2.w.en&&c1.t!==c2.t){sGood();b1.classList.add('ok');b2.classList.add('ok');if(++done===ch.length){const m=el.querySelector('#mmm');m.className='msg ok pop';m.textContent=`رائع! أنهيتها في ${ar(moves)} محاولة.`;confetti();}}else{lock=true;setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false;},950);}}});
 el.querySelector('#mnew').onclick=()=>memoryGame(el,L);}
function enPlay(root,L){root.innerHTML=`<div id="eg1"></div><div id="eg2" style="margin-top:18px"></div>`;(EN_GAME[L.id]||(()=>{}))(root.querySelector('#eg1'),L);memoryGame(root.querySelector('#eg2'),L);}

render();
})();
</script>
