<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مدرسة محمد: دروس تفاعلية في الرياضيات والإنجليزي للصف الثاني الابتدائي">
<meta name="theme-color" content="#F2862B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect x='2' y='2' width='30' height='30' rx='8' fill='%23F2862B' stroke='%2316264A' stroke-width='3'/%3E%3Cpath d='M12 9v16M22 9v16M9 17h16' stroke='%2316264A' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>مدرسة محمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: squared math-notebook page. Tens are always BLUE, ones always ORANGE, across every screen. */
:root{
  --paper:#F3F8FF; --grid:#DCE8F7; --card:#FFFFFF; --ink:#16264A; --muted:#5A6A8A;
  --tens:#1C8FD0; --tens-edge:#0E5F8F; --ones:#F2862B; --ones-edge:#C9640F;
  --leaf:#1E9E63; --berry:#E2475A; --sun:#FFC531; --line:#C9D7EC; --violet:#8B5CF6;
  --l1:#F2862B; --l2:#1C8FD0; --l3:#8B5CF6; --l4:#1E9E63; --l5:#E2475A;
  --soft:#E9F2FD; --ok-bg:#E3F7EC; --bad-bg:#FDE8EB; --hint-bg:#FFF6D6; --on-sun:#3A2A00;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1830; --grid:#16264A; --card:#15223F; --ink:#EEF3FF; --muted:#A3B2D3;
  --tens:#4AB3EE; --tens-edge:#1C6E9E; --ones:#F59A47; --ones-edge:#B9600F;
  --leaf:#3CC685; --berry:#F06A7B; --sun:#FFD25E; --line:#2A3D66; --violet:#A78BFA;
  --l1:#F59A47; --l2:#4AB3EE; --l3:#A78BFA; --l4:#3CC685; --l5:#F06A7B;
  --soft:#1B2B50; --ok-bg:#123A2A; --bad-bg:#3D1A24; --hint-bg:#3A3215; --on-sun:#3A2A00; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1830; --grid:#16264A; --card:#15223F; --ink:#EEF3FF; --muted:#A3B2D3;
  --tens:#4AB3EE; --tens-edge:#1C6E9E; --ones:#F59A47; --ones-edge:#B9600F;
  --leaf:#3CC685; --berry:#F06A7B; --sun:#FFD25E; --line:#2A3D66; --violet:#A78BFA;
  --l1:#F59A47; --l2:#4AB3EE; --l3:#A78BFA; --l4:#3CC685; --l5:#F06A7B;
  --soft:#1B2B50; --ok-bg:#123A2A; --bad-bg:#3D1A24; --hint-bg:#3A3215; --on-sun:#3A2A00; color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.7;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px 60px}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tens);outline-offset:3px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.T{color:var(--tens);font-weight:800}.O{color:var(--ones);font-weight:800}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:22px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:700;font-size:16px}
.toggle{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:700;font-size:15px}
.toggle[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
.star{color:var(--sun)} .star.off{color:var(--line)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:22px 24px;box-shadow:6px 6px 0 var(--ink);margin-bottom:24px}
.hero h1{font-size:clamp(32px,6vw,50px)} .hero h1 span{color:var(--ones)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:54ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-weight:700;font-size:16px;align-items:center}
.legend svg{vertical-align:middle}
.mascot{width:140px;max-width:100%;height:auto}
@media (max-width:620px){.hero{grid-template-columns:1fr}.mascot{width:100px;justify-self:center;grid-row:1}}

.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.lcard{text-align:start;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.lcard:hover{transform:translate(-2px,-2px)}
.code{display:inline-flex;align-self:flex-start;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;border-radius:10px;padding:0 12px}
.lcard h3{font-size:23px}
.lcard p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.lvbar{display:flex;gap:6px;margin-top:auto;padding-top:6px;align-items:center}
.lvbar i{flex:1;height:10px;border-radius:6px;background:var(--line);display:block}
.lvbar i.on{background:var(--c)}
.lvbar span{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.lcard.dark{background:var(--ink);color:var(--paper)} .lcard.dark p{color:var(--line)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.section-title h2{font-size:26px} .section-title small{color:var(--muted);font-size:16px}
.ghost{background:transparent;border:2px dashed var(--muted);border-radius:14px;padding:10px 16px;font-weight:700;color:var(--muted);margin-top:20px}

/* lesson */
.lhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lhead .code{font-size:22px;border-radius:14px;padding:2px 14px}
.lhead h1{font-size:clamp(25px,5vw,36px)}
.back{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 14px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:5px 18px;font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;gap:8px;align-items:center}
.tab small{font-family:var(--f-body);font-size:13px;opacity:.75}
.tab[aria-selected="true"]{background:var(--c);color:#fff;border-color:var(--c);box-shadow:3px 3px 0 var(--ink)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
.panel + .panel{margin-top:18px}
.panel h2{font-size:25px;margin-bottom:6px}

/* story */
.sp-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sbar{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--c);border-radius:8px;transition:width .3s}
.sp-top span{font-weight:800;font-size:16px;color:var(--muted)}
.sp-title{font-size:clamp(24px,4.6vw,32px)!important;text-align:center;margin-bottom:10px!important}
.sp-say{font-size:22px;text-align:center;max-width:44ch;margin:0 auto 12px;line-height:1.8}
.sp-body{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;min-height:180px}
.sp-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--c,var(--tens));color:#fff;border:3px solid var(--ink);border-radius:14px;padding:7px 20px;font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--leaf)}
.btn.small{font-size:16px;padding:3px 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.say-btn{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:800;font-size:16px;display:inline-flex;gap:6px;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.box{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.box .eq{font-family:var(--f-display);font-size:24px;font-weight:700}
.arrow{font-size:40px;font-weight:800;color:var(--muted);align-self:center}
.big-eq{font-family:var(--f-display);font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;direction:ltr}
.chip{min-width:46px;padding:2px 10px;border-radius:10px;border:2px solid var(--line);font-family:var(--f-display);font-size:24px;font-weight:800;opacity:.25;transition:opacity .2s, transform .2s}
.chip.on{opacity:1;transform:scale(1.08)}
.chip.t{color:var(--tens);border-color:var(--tens)} .chip.o{color:var(--ones);border-color:var(--ones)}
.summary{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;text-align:start;max-width:560px;width:100%}
.summary li{background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:700}
.check{width:100%;max-width:620px;margin:16px auto 0;border:3px dashed var(--c);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.check .ql{font-weight:800;font-size:15px;color:var(--c)}
.check .qq{font-size:21px;font-weight:700}

/* blocks */
svg.blocks{max-width:100%;height:auto}
.rod rect{fill:var(--tens);stroke:var(--tens-edge);stroke-width:1}
.unit{fill:var(--ones);stroke:var(--ones-edge);stroke-width:1}
.rod.lit rect,.unit.lit{stroke:var(--ink);stroke-width:3}
.rod.dim,.unit.dim{opacity:.2}
.pvn{font-family:var(--f-display);font-weight:800;direction:ltr;display:inline-flex;gap:2px;line-height:1}
.pvn .t{color:var(--tens)} .pvn .o{color:var(--ones)}
.pvn.xl{font-size:76px}
.bignum{font-family:var(--f-display);font-size:68px;font-weight:800;line-height:1;direction:ltr;display:inline-flex;gap:2px}
.bignum .hl{background:var(--sun);color:var(--on-sun);border-radius:10px;padding:0 8px}

/* houses */
.houses{display:flex;gap:10px;direction:ltr;justify-content:center}
.house{display:flex;flex-direction:column;align-items:center;gap:2px}
.house svg{width:120px;height:auto}
.house small{direction:rtl;font-weight:800;font-size:16px}

/* number line */
.nl{max-width:100%;height:auto;direction:ltr}
.nl text{font-family:var(--f-display);font-weight:800;font-size:20px;fill:var(--ink)}
.nl .g text{fill:var(--line)}
.nl .g line{stroke:var(--line)}
.clues{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.clue{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:4px 14px;font-weight:800}
.clue.used{background:var(--ok-bg);border-color:var(--leaf)}

/* activities */
.act{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.tray{min-height:190px;width:100%;border:3px dashed var(--line);border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding:12px;overflow-x:auto}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg{min-height:32px;font-weight:800;font-size:19px}
.msg.ok{color:var(--leaf)} .msg.bad{color:var(--berry)}
.target{font-size:21px;font-weight:700}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dcard{width:78px;height:92px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--on-sun);font-family:var(--f-display);font-size:50px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.dcard.used{opacity:.25}
.slots{display:flex;gap:12px;direction:ltr;justify-content:center}
.slot{width:86px;height:100px;border:3px dashed var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft)}
.slot .v{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1}
.slot small{font-size:13px;direction:rtl;font-weight:700}
.story{background:var(--soft);border-radius:16px;padding:12px 16px;text-align:start;width:100%}
.birds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bird{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:6px 14px;font-weight:800;display:flex;align-items:center;gap:6px}
.bird .e{font-size:30px;line-height:1}
.bird.sel{background:var(--sun);color:var(--on-sun)} .bird.placed{opacity:.3}
.cages{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cage{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;width:120px}
.cage svg{width:110px;height:auto} .cage .who{min-height:34px;font-weight:800}
.dolls,.doll-slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.doll{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:15px}
.doll svg{width:52px;height:70px} .doll.used{opacity:.25}
.doll-slot{width:84px;min-height:118px;border:3px dashed var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft);font-size:14px}
.doll-slot svg{width:46px;height:62px}
.lab-num{display:flex;gap:10px;align-items:center;justify-content:center}
.lab-num input[type=range]{width:min(420px,80vw);accent-color:var(--c)}
.words{font-family:var(--f-display);font-size:34px;font-weight:700}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.mbtn{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:8px;font-weight:800;min-height:56px}
.mbtn.n{font-family:var(--f-display);font-size:30px}
.mbtn.sel{background:var(--sun);color:var(--on-sun)} .mbtn.done{background:var(--ok-bg);border-color:var(--leaf);opacity:.7}
.mbtn.no{animation:shake .35s}
.jars{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.jar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.jar svg{max-width:100%;height:auto} .jar .cap{font-weight:800}

/* practice */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lvl{border:3px solid var(--ink);border-radius:20px;background:var(--card);padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--ink)}
.lvl h3{font-size:24px} .lvl p{margin:0;font-size:16px;color:var(--muted);line-height:1.5}
.lvl .st{font-weight:800;font-size:15px}
.lvl.locked{opacity:.5;box-shadow:none;cursor:not-allowed}
.lvl.passed{border-color:var(--leaf)}
.drill-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--leaf)} .dots i.half{background:var(--sun)} .dots i.bad{background:var(--berry)} .dots i.now{box-shadow:0 0 0 3px var(--ink);background:var(--card)}
.q{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.prompt{font-size:25px;font-weight:700;line-height:1.6;max-width:40ch}
.prompt b{font-family:var(--f-display)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%;max-width:620px}
.opt{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px;font-size:22px;font-weight:800;min-height:66px;box-shadow:3px 3px 0 var(--ink)}
.opt.n{font-family:var(--f-display);font-size:34px}
.opt.right{background:var(--ok-bg);border-color:var(--leaf)}
.opt.wrong{background:var(--bad-bg);border-color:var(--berry);opacity:.6}
.answer-box{display:flex;flex-direction:column;align-items:center;gap:10px}
.ansfield{min-width:150px;height:72px;border:3px solid var(--ink);border-radius:16px;background:var(--soft);font-family:var(--f-display);font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;padding-inline:14px;direction:ltr}
.ansfield.right{background:var(--ok-bg);border-color:var(--leaf)} .ansfield.wrong{background:var(--bad-bg);border-color:var(--berry)}
.pad{display:grid;grid-template-columns:repeat(5,58px);gap:8px;direction:ltr;justify-content:center}
.pad button{height:56px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font-family:var(--f-display);font-size:28px;font-weight:800}
.pad .wide{grid-column:span 4;font-family:var(--f-body);font-size:20px;background:var(--leaf);color:#fff}
.pad .del{font-family:var(--f-body);font-size:17px}
@media (max-width:400px){.pad{grid-template-columns:repeat(5,52px)}}
.hintbox{width:100%;max-width:620px;background:var(--hint-bg);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hintbox .hv{align-self:center;max-width:100%;overflow-x:auto}
.feedback{width:100%;max-width:620px;border-radius:16px;padding:12px 16px;text-align:start;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback strong{font-family:var(--f-display);font-size:23px}
.qtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .score{font-family:var(--f-display);font-size:64px;font-weight:800;color:var(--c);line-height:1}
.result .stars{font-size:44px}
table.prog{width:100%;border-collapse:collapse;font-size:16px}
table.prog th,table.prog td{border-bottom:2px solid var(--line);padding:8px;text-align:start;vertical-align:top}
.tablewrap{overflow-x:auto;width:100%}
.tip{border-inline-start:6px solid var(--c);background:var(--soft);padding:10px 14px;border-radius:12px;margin-top:12px;text-align:start}

/* tests, faces, medals */
.opt.sel{background:var(--sun);color:var(--on-sun);border-width:4px}
.dots i.done{background:var(--c)}
.fbrow{display:flex;gap:12px;align-items:flex-start}
.fbrow .fbc{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.face{flex:none}
.medals{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.medal{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.skill .nm{font-weight:700;min-width:0}
.skill .nm small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.meter{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:8px}
.chipst{font-weight:800;font-size:14px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.chipst.good{background:var(--ok-bg);color:var(--leaf)} .chipst.weak{background:var(--bad-bg);color:var(--berry)}

  if(n===11)return 'أحد عشر'; if(n===12)return 'اثنا عشر'; if(n<20)return ONES[n-10]+' عشر';
  const t=Math.floor(n/10),u=n%10; return u?ONES[u]+' و'+TENS[t]:TENS[t];
}
function wordsColored(n){const t=Math.floor(n/10),u=n%10;if(n<21||!u||n===100)return words(n);return `<span class="O">${ONES[u]}</span> و<span class="T">${TENS[t]}</span>`;}

const onesW=u=>u===0?'صفر آحاد':u===1?'واحد':u===2?'اثنان':ar(u)+' آحاد';
const pvn=(n,cls='')=>{const s=ar(n);if(n<10||n>99)return `<span class="pvn ${cls}"><span class="o">${s}</span></span>`;return `<span class="pvn ${cls}"><span class="t">${s[0]}</span><span class="o">${s[1]}</span></span>`;};

let actx=null;
function tone(fs,d=.12,type='sine'){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+i*d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);});}catch(e){}}
const sGood=()=>tone([660,880,1100],.1), sBad=()=>tone([300,220],.16,'triangle'), sTap=()=>tone([520],.05), sWin=()=>tone([523,659,784,1046,1318],.12), sPop=()=>tone([700],.06);
const canSpeak=(()=>{try{return 'speechSynthesis' in window;}catch(e){return false;}})();
function speak(html){if(!canSpeak)return;try{const d=document.createElement('div');d.innerHTML=html;const text=d.textContent.replace(/\s+/g,' ').trim();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.82;const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
const hush=()=>{try{if(canSpeak)speechSynthesis.cancel();}catch(e){}};
let hasAr=false,hasEn=false,enVoice=null;
function pickEn(vs){const e=vs.filter(v=>/^en/i.test(v.lang));hasEn=e.length>0;enVoice=null;for(const r of [/Samantha/i,/Google US English/i,/Aria|Jenny|Ava|Allison|Zira/i,/en[-_]US/i,/en[-_]GB/i]){enVoice=e.find(v=>r.test(v.name)||r.test(v.lang));if(enVoice)break;}if(!enVoice)enVoice=e[0]||null;}
const checkVoices=()=>{try{const vs=speechSynthesis.getVoices();hasAr=vs.some(v=>/^ar/i.test(v.lang));pickEn(vs);}catch(e){hasAr=false;hasEn=false;}};
const enOK=()=>canSpeak&&hasEn;
const voiceOK=()=>canSpeak&&hasAr;
if(canSpeak){checkVoices();try{speechSynthesis.addEventListener('voiceschanged',()=>{const b=hasAr,c=hasEn;checkVoices();if((b!==hasAr||c!==hasEn)&&typeof render==='function')render(true);});}catch(e){}}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#F2862B','#1C8FD0','#1E9E63','#FFC531','#E2475A','#8B5CF6'];const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6,c:pick(cols)}));let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<170)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();}

function blocks(t,u,o={}){
  const S=o.size||14,gap=8,rodH=S*10;const uc=Math.ceil(u/5)||0;
  const W=Math.max(30,t*(S+gap)+(u?(gap*2+uc*(S+3)):0)+4),H=rodH+4;let g='';
  for(let i=0;i<t;i++){const x=2+i*(S+gap);let r='';for(let k=0;k<10;k++)r+=`<rect x="${x}" y="${2+k*S}" width="${S}" height="${S}" rx="2"/>`;g+=`<g class="rod${o.dim==='tens'?' dim':''}" data-i="${i}">${r}</g>`;}
  const ux=2+t*(S+gap)+(t?gap:0);
  for(let i=0;i<u;i++){const c=Math.floor(i/5),r=i%5;g+=`<rect class="unit${o.dim==='ones'?' dim':''}" data-j="${i}" x="${ux+c*(S+3)}" y="${2+rodH-(r+1)*(S+3)+3}" width="${S}" height="${S}" rx="2"/>`;}
  return `<svg class="blocks" viewBox="0 0 ${W} ${H}" width="${W*(o.scale||1)}" style="direction:ltr" role="img" aria-label="${tensW(t)} و ${onesW(u)}">${g}</svg>`;
}
function unitRow(n,o={}){const S=22,g=6;const W=Math.max(30,n*(S+g));let s='';for(let i=0;i<n;i++)s+=`<rect class="unit" data-j="${i}" x="${i*(S+g)+2}" y="2" width="${S}" height="${S}" rx="3"/>`;return `<svg class="blocks" viewBox="0 0 ${W+4} ${S+4}" width="${W+4}" style="direction:ltr">${s}</svg>`;}
const MCOL=['#F2862B','#1C8FD0','#1E9E63','#E2475A','#FFC531','#8B5CF6'];
function item(kind,x,y,color,grp){const ga=grp!=null?` data-g="${grp}"`:'';
  if(kind==='button')return `<g${ga}><circle cx="${x}" cy="${y}" r="10" fill="${color}" stroke="#16264A" stroke-width="1"/><circle cx="${x-3}" cy="${y-3}" r="1.6" fill="#16264A"/><circle cx="${x+3}" cy="${y-3}" r="1.6" fill="#16264A"/><circle cx="${x-3}" cy="${y+3}" r="1.6" fill="#16264A"/><circle cx="${x+3}" cy="${y+3}" r="1.6" fill="#16264A"/></g>`;
  if(kind==='star'){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?4.5:11;p+=(x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1)+' ';}return `<polygon${ga} points="${p}" fill="${color}" stroke="#16264A" stroke-width="1"/>`;}
  return `<g${ga}><circle cx="${x}" cy="${y}" r="10" fill="${color}" stroke="#16264A" stroke-width="1"/><circle cx="${x-3.5}" cy="${y-3.5}" r="3" fill="#FFFFFF" opacity=".75"/></g>`;}
function scatter(n,kind,o={}){const C=26,cols=o.cols||8;const rows=Math.max(2,Math.ceil(n*1.35/cols));const cells=shuffle([...Array(rows*cols).keys()]).slice(0,n).sort((a,b)=>a-b);const W=cols*C+20,H=rows*C+28;const color=o.color||pick(MCOL);
  let s=`<rect x="3" y="14" width="${W-6}" height="${H-17}" rx="16" fill="none" stroke="var(--muted)" stroke-width="3"/><rect x="${W*.2}" y="3" width="${W*.6}" height="14" rx="5" fill="var(--berry)"/>`;
  cells.forEach((c,i)=>{const r=Math.floor(c/cols),k=c%cols;s+=item(kind,13+k*C+rnd(-3,3),24+r*C+rnd(-3,3),o.multi?MCOL[i%MCOL.length]:color,o.groups?Math.floor(i/10):null);});
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="مجموعة أشياء">${s}</svg>`;}
function colorGroups(svgRoot){const pal=['#F2862B','#1C8FD0','#1E9E63','#E2475A','#8B5CF6','#FFC531','#14B8A6','#EC4899','#64748B','#A16207'];svgRoot.querySelectorAll('[data-g]').forEach(el=>{const k=+el.dataset.g;if(el.tagName==='polygon')el.setAttribute('fill',pal[k%10]);else el.querySelector('circle').setAttribute('fill',pal[k%10]);});}
function numberLine(a,b,o={}){const step=46,W=(b-a)*step+40,H=o.ring!=null?78:70;const gray=o.gray||new Set();let s=`<line x1="10" y1="22" x2="${W-10}" y2="22" stroke="var(--ink)" stroke-width="3"/>`;

function domino(a,b,o={}){const S=60;const half=(n,x)=>n==='?'?`<text x="${x+S/2}" y="${S/2+14}" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Baloo Bhaijaan 2,Tajawal,sans-serif">؟</text>`:(PIPS[n]||[]).map(p=>`<circle cx="${x+12+(p%3)*18}" cy="${15+Math.floor(p/3)*18}" r="6" fill="#FFFFFF"/>`).join('');
 return `<svg viewBox="0 0 ${2*S+6} ${S+12}" width="${(2*S+6)*(o.scale||1.4)}" style="direction:ltr;max-width:100%" role="img" aria-label="قطعة دومينو"><rect x="3" y="3" width="${2*S}" height="${S+6}" rx="10" fill="${o.col||'#E2475A'}" stroke="#16264A" stroke-width="3"/><line x1="${S+3}" y1="9" x2="${S+3}" y2="${S+3}" stroke="#16264A" stroke-width="3"/>${half(b,3)}${half(a,S+3)}</svg>`;}
function tenFrames(a,b=0,o={}){const n=a+b,frames=Math.max(1,Math.ceil(n/10)),C=34,gap=12;let s='';
 for(let f=0;f<frames;f++){const y=f*(2*C+gap)+2;s+=`<rect x="2" y="${y}" width="${5*C}" height="${2*C}" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>`;for(let k=1;k<5;k++)s+=`<line x1="${2+k*C}" y1="${y}" x2="${2+k*C}" y2="${y+2*C}" stroke="var(--ink)" stroke-width="2"/>`;s+=`<line x1="2" y1="${y+C}" x2="${2+5*C}" y2="${y+C}" stroke="var(--ink)" stroke-width="2"/>`;}
 for(let i=0;i<n;i++){const f=Math.floor(i/10),j=i%10,r=Math.floor(j/5),c=j%5;s+=`<circle cx="${2+c*C+C/2}" cy="${f*(2*C+gap)+2+r*C+C/2}" r="${C*.36}" fill="${i<a?RED:YEL}" stroke="#16264A" stroke-width="1.5"/>`;}
 const W=5*C+4,H=frames*(2*C+gap)-gap+4;return `<svg viewBox="0 0 ${W} ${H}" width="${W*(o.scale||1)}" style="direction:ltr;max-width:100%" role="img" aria-label="إطار العشرة">${s}</svg>`;}
function cubes(a,b=0,o={}){const S=24,n=a+b,W=Math.max(n,1)*S+4;let s='';for(let i=0;i<n;i++){const x=W-2-(i+1)*S;s+=`<rect x="${x}" y="2" width="${S-2}" height="${S-2}" rx="3" fill="${i<a?(o.c1||'#1E9E63'):(o.c2||RED)}" stroke="#16264A" stroke-width="1.5"/>`;}return `<svg viewBox="0 0 ${W} ${S+4}" width="${W*(o.scale||1)}" style="max-width:100%" role="img" aria-label="مكعبات">${s}</svg>`;}
function nlJump(a,b,from,n,dir,shown,o={}){if(shown==null)shown=n;const st=40,W=(b-a)*st+40,X=k=>20+(k-a)*st;let s=`<line x1="8" y1="54" x2="${W-8}" y2="54" stroke="var(--ink)" stroke-width="3"/>`;
 for(let k=a;k<=b;k++)s+=`<line x1="${X(k)}" y1="46" x2="${X(k)}" y2="62" stroke="var(--ink)" stroke-width="3"/><text x="${X(k)}" y="88" text-anchor="middle">${ar(k)}</text>`;
 if(from!=null){s+=`<circle cx="${X(from)}" cy="54" r="8" fill="var(--tens)"/>`;
  for(let j=0;j<shown;j++){const p=from+dir*j,q=p+dir;s+=`<path d="M${X(p)} 47 Q${(X(p)+X(q))/2} 6 ${X(q)} 47" fill="none" stroke="var(--berry)" stroke-width="3"/><text class="nlj" x="${(X(p)+X(q))/2}" y="26" text-anchor="middle">${ar(j+1)}</text>`;}
  if(shown===n&&n>0&&!o.noEnd)s+=`<circle cx="${X(from+dir*n)}" cy="81" r="18" fill="none" stroke="var(--leaf)" stroke-width="3.5"/>`;}
 return `<svg class="nl" viewBox="0 0 ${W} 100" width="${W}" style="direction:ltr;max-width:100%" role="img" aria-label="خط الأعداد">${s}</svg>`;}
function factTri(top,a,b,o={}){const t=v=>v==='?'?'؟':ar(v);const col=o.col||'#8B5CF6';return `<svg viewBox="0 0 170 150" width="${170*(o.scale||1)}" role="img" aria-label="مثلث الحقائق"><path d="M85 8 L162 140 H8 Z" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="5" stroke-linejoin="round"/><circle cx="85" cy="58" r="22" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><text x="85" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Baloo Bhaijaan 2,sans-serif">${t(top)}</text><circle cx="48" cy="114" r="20" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><text x="48" y="123" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)" font-family="Baloo Bhaijaan 2,sans-serif">${t(b)}</text><circle cx="122" cy="114" r="20" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><text x="122" y="123" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)" font-family="Baloo Bhaijaan 2,sans-serif">${t(a)}</text></svg>`;}
const ems=(e,n)=>`<span class="ems" aria-label="${ar(n)}">${Array.from({length:n},()=>`<i>${e}</i>`).join('')}</span>`;
const THINGS=[['🐜','نملة','نملات'],['🐞','حشرة','حشرات'],['🦋','فراشة','فراشات'],['🐝','نحلة','نحلات'],['🍎','تفاحة','تفاحات'],['🎈','بالونًا','بالونات'],['⚽','كرة','كرات'],['✏️','قلمًا','أقلام'],['🐟','سمكة','سمكات'],['🌼','وردة','ورود']];

story:[
 {t:'ما هو الجمع؟',say:'الجمع يعني أن نضمّ مجموعتين معًا. ٣ نقاط و ٥ نقاط تصبح ٨ نقاط.',body:()=>`${domino(3,5)}<div class="big-eq">٣ + ٥ = ٨</div><div class="row"><div class="box"><span class="eq">٣ و ٥</span><b>الأعداد المضافة</b></div><div class="box"><span class="eq">٨</span><b>ناتج الجمع</b></div></div>`},
 {t:'اقلب القطعة!',say:'اضغط الزر لتقلب قطعة الدومينو. هل تغيّر عدد النقاط؟',body:()=>`<div id="dm">${domino(3,5)}</div><div class="big-eq" id="de">٣ + ٥ = ٨</div><button class="btn" id="flip">اقلب القطعة</button><div class="big-eq" id="dr" style="opacity:0;color:var(--leaf)">الناتج لم يتغيّر!</div>`,
  mount(el){let f=false;el.querySelector('#flip').onclick=()=>{f=!f;el.querySelector('#dm').innerHTML=f?domino(5,3):domino(3,5);el.querySelector('#de').textContent=f?'٥ + ٣ = ٨':'٣ + ٥ = ٨';el.querySelector('#dr').style.opacity=1;sGood();};}},
 {t:'خاصية الإبدال',say:'عندما نغيّر ترتيب العددين، لا يتغيّر ناتج الجمع. هذه اسمها خاصية الإبدال.',body:()=>`<div class="row"><div class="box">${domino(2,6,{scale:1})}<span class="eq">٢ + ٦ = ٨</span></div><div class="box">${domino(6,2,{scale:1})}<span class="eq">٦ + ٢ = ٨</span></div></div>`,
  check:{q:'٤ + ٣ = ٧، إذن ٣ + ٤ = ؟',opts:[7,1,12],ans:7,hint:'غيّرنا الترتيب فقط.',why:'تغيير الترتيب لا يغيّر الناتج: ٣ + ٤ = ٧'}},
 {t:'جمع الصفر',say:'إذا جمعنا صفرًا إلى أي عدد، يبقى العدد كما هو.',body:()=>`${domino(5,0)}<div class="big-eq">٥ + ٠ = ٥</div>`,check:{q:'٩ + ٠ = ؟',opts:[9,0,10],ans:9,hint:'الصفر يعني لا شيء.',why:'٩ + ٠ = ٩'}},
 {t:'تذكّر دائمًا',say:'تغيير ترتيب الأعداد لا يغيّر الناتج، وجمع الصفر لا يغيّر العدد.',body:()=>`<ul class="summary"><li>٣ + ٥ = ٥ + ٣ (خاصية الإبدال)</li><li>أي عدد + ٠ = العدد نفسه</li><li>الأعداد المضافة ← ناتج الجمع</li></ul>`}],
levels:[
 [G2('أجد ناتج الجمع',0,()=>{const a=rnd(1,6),b=rnd(1,6);return choice('كم نقطة في القطعة كلها؟',sumOpts(a,b),a+b,'عُدّ نقاط الجهتين معًا.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,{visual:domino(a,b)});}),
  G2('خاصية الإبدال',2,()=>{const a=rnd(1,6),b=rnd(1,6);return choice(`${ar(a)} + ${ar(b)} = ${ar(a+b)}، إذن ${ar(b)} + ${ar(a)} = ؟`,nopts(a+b,[Math.abs(a-b)]),a+b,'غيّرنا الترتيب فقط، فالناتج نفسه.',`${ar(b)} + ${ar(a)} = ${ar(a+b)}`,{visual:domino(b,a)});}),
  G2('جمع الصفر',3,()=>{const a=rnd(1,9);return choice(`${ar(a)} + ٠ = ؟`,[a,0,a+1],a,'الصفر لا يغيّر العدد.',`${ar(a)} + ٠ = ${ar(a)}`,{visual:domino(a,0)});})],
 [G2('أجد ناتج الجمع',0,()=>{const a=rnd(2,9),b=rnd(1,Math.min(9,12-a));return input(`${ar(a)} + ${ar(b)} = ؟`,a+b,'ابدأ بالعدد الأكبر وعُدّ.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`);}),
  G2('خاصية الإبدال',2,()=>{const a=rnd(1,9),b=rnd(1,9);return input(`${ar(a)} + ${ar(b)} = ؟ + ${ar(a)}`,b,'الطرفان فيهما العددان نفساهما.',`${ar(a)} + ${ar(b)} = ${ar(b)} + ${ar(a)}`);}),
  G2('جمع الصفر',3,()=>{const a=rnd(1,12);return Math.random()<.5?input(`٠ + ${ar(a)} = ؟`,a,'الصفر لا يغيّر العدد.',`٠ + ${ar(a)} = ${ar(a)}`):input(`؟ + ٠ = ${ar(a)}`,a,'أي عدد مع الصفر يبقى كما هو.',`${ar(a)} + ٠ = ${ar(a)}`);})],
 [G2('خاصية الإبدال',2,()=>{const a=rnd(1,8),b=rnd(1,8);return input(`؟ + ${ar(b)} = ${ar(b)} + ${ar(a)}`,a,'الطرف الأيسر فيه العددان نفساهما بترتيب آخر.',`${ar(a)} + ${ar(b)} = ${ar(b)} + ${ar(a)}`);}),
  G2('مسائل الجمع',4,()=>{const a=rnd(2,7),b=rnd(2,7),n1=pick(NG),n2=pick(NG.filter(x=>x!==n1)),t=pick(THINGS);return input(`مع ${n1} ${ar(a)} ${t[2]}، ومع ${n2} ${ar(b)} ${t[2]}. كم معهما معًا؟`,a+b,'اجمع العددين.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,{visual:ems(t[0],a)+' '+ems(t[0],b)});}),
  G2('خاصية الإبدال',2,()=>{const a=rnd(1,8),b=rnd(1,8),ok=Math.random()<.5,c=ok?a:a+rnd(1,2);return choice(`هل ${ar(a)} + ${ar(b)} = ${ar(b)} + ${ar(c)} ؟`,['صحيحة','خاطئة'],ok?'صحيحة':'خاطئة','هل الطرفان فيهما العددان نفساهما؟',ok?'صحيحة: العددان نفساهما بترتيب مختلف.':`خاطئة: ${ar(a)} + ${ar(b)} = ${ar(a+b)} و ${ar(b)} + ${ar(c)} = ${ar(b+c)}`);})]],
play:playDom});

L.push({id:22,ch:2,code:'٢-٢',title:'الجمع بالعدّ التصاعدي',short:'العدّ التصاعدي',color:'var(--l2)',blurb:'أبدأ بالعدد الأكبر وأعدّ ١ أو ٢ أو ٣.',
story:[

  mount(el){let d=0;el.querySelector('#hop').onclick=()=>{if(d<3){d++;sPop();el.querySelector('#nl').innerHTML=nlJump(5,12,7,3,1,d,{noEnd:d<3});if(d===3){el.querySelector('#ne').textContent='٧ + ٣ = ١٠';sGood();}}};}},
 {t:'نعدّ تصاعديًا',say:'نقول: سبعة… ثم ثمانية، تسعة، عشرة. وصلنا إلى عشرة.',body:()=>`<div class="chips">${['٧','٨','٩','١٠'].map((x,i)=>`<span class="chip ${i?'o on':'t on'}">${x}</span>`).join('')}</div><div class="big-eq">٧ + ٣ = ١٠</div>`},
 {t:'ابدأ بالعدد الأكبر',say:'في ٢ + ٨ نبدأ بالعدد الأكبر ٨، ونعدّ قفزتين: ٩، ١٠. هذا أسرع من أن نبدأ بـ ٢.',body:()=>`${nlJump(6,12,8,2,1)}<div class="big-eq">٢ + ٨ = ٨ + ٢ = ١٠</div>`,check:{q:'في ٣ + ٩ من أي عدد نبدأ العدّ؟',opts:[9,3,12],ans:9,hint:'ابدأ بالعدد الأكبر.',why:'نبدأ بـ ٩ ثم نعدّ: ١٠، ١١، ١٢.'}},
 {t:'جرّب',say:'استعمل خط الأعداد لتجد ٦ + ٢.',body:()=>nlJump(3,10,6,2,1,0,{noEnd:true}),check:{q:'٦ + ٢ = ؟',opts:[8,7,4],ans:8,hint:'ابدأ من ٦ ثم: ٧، ٨.',why:'٦ ثم ٧، ٨. إذن ٦ + ٢ = ٨'}},
 {t:'تذكّر دائمًا',say:'ابدأ بالعدد الأكبر، ثم عُدّ تصاعديًا ١ أو ٢ أو ٣.',body:()=>`<ul class="summary"><li>ابدأ بالعدد <b>الأكبر</b>.</li><li>عُدّ إلى الأمام: + ١ قفزة، + ٢ قفزتان، + ٣ ثلاث قفزات.</li><li>العدد الذي تصل إليه هو ناتج الجمع.</li></ul>`}],
levels:[
 [G2('أعدّ تصاعديًا على خط الأعداد',0,()=>{const a=rnd(3,15),n=rnd(1,3);return choice(`${ar(a)} + ${ar(n)} = ؟`,nopts(a+n,[a,a+n+1]),a+n,`ابدأ من ${ar(a)} وعُدّ القفزات.`,`${ar(a)} ثم ${Array.from({length:n},(_,i)=>ar(a+i+1)).join('، ')}`,{visual:nlJump(Math.max(0,a-2),a+n+2,a,n,1,n,{noEnd:true})});}),
  G2('أبدأ بالعدد الأكبر',2,()=>{const n=rnd(1,3),a=rnd(5,12);return choice(`في ${ar(n)} + ${ar(a)} من أي عدد نبدأ العدّ التصاعدي؟`,[a,n,a+n],a,'ابدأ دائمًا بالعدد الأكبر.',`نبدأ بـ ${ar(a)} ثم نعدّ ${ar(n)}.`);})],
 [G2('أعدّ تصاعديًا على خط الأعداد',0,()=>{const a=rnd(3,17),n=rnd(1,3);return input(`${ar(a)} + ${ar(n)} = ؟`,a+n,`ابدأ من ${ar(a)} وعُدّ ${ar(n)}.`,`${ar(a)} + ${ar(n)} = ${ar(a+n)}`);}),
  G2('أبدأ بالعدد الأكبر',2,()=>{const n=rnd(1,3),a=rnd(4,16);return input(`${ar(n)} + ${ar(a)} = ؟`,a+n,`ابدأ بـ ${ar(a)} لأنه الأكبر، ثم عُدّ ${ar(n)}.`,`${ar(a)} ثم ${Array.from({length:n},(_,i)=>ar(a+i+1)).join('، ')}`);})],
 [G2('مسائل العدّ التصاعدي',3,()=>{const a=rnd(5,15),n=rnd(1,3),t=pick(THINGS);return input(`في حديقة ${ar(a)} ${t[2]}، ثم جاءت ${ar(n)} أخرى. كم أصبح العدد؟`,a+n,`عُدّ تصاعديًا من ${ar(a)}.`,`${ar(a)} + ${ar(n)} = ${ar(a+n)}`);}),
  G2('أعدّ تصاعديًا على خط الأعداد',0,()=>{const a=rnd(5,16),n=rnd(1,3);return input(`عددت تصاعديًا من ${ar(a)} بمقدار ${ar(n)}. إلى أي عدد وصلت؟`,a+n,'كل قفزة تزيد واحدًا.',`${ar(a)} + ${ar(n)} = ${ar(a+n)}`);}),
  G2('أبدأ بالعدد الأكبر',2,()=>{const n=rnd(1,3),a=rnd(5,16);return input(`؟ = ${ar(n)} + ${ar(a)}`,a+n,'ابدأ بالأكبر.',`${ar(a)} + ${ar(n)} = ${ar(a+n)}`);})]],
play:r=>playHop(r,1)});

L.push({id:23,ch:2,code:'٢-٣',title:'أحل المسألة: أمثّلها',short:'أمثّل المسألة',color:'var(--l3)',blurb:'أستعمل أشياء حقيقية لأمثّل المسألة وأحلها.',
story:[
 {t:'المسألة',say:'في بيت النمل ٨ نملات، دخلت إليه نملتان جديدتان. كم نملة في بيت النمل الآن؟',body:()=>`<div class="story" style="font-size:22px;text-align:center">في بيت النمل ٨ نملات، دخلت إليه نملتان جديدتان. كم نملة الآن؟</div>${ems('🐜',8)}`},
 {t:'أفهم وأخطط',say:'المطلوب: عدد النمل الآن. سنمثّل المسألة: نضع ٨ نملات، ثم نضيف ٢.',body:()=>`<div class="plan"><div><b>أفهم</b>المطلوب: عدد النمل الآن</div><div><b>أخطط</b>أمثّل بأشياء</div><div><b>أحل</b>أضع ثم أضيف</div><div><b>أتحقق</b>أعدّ مرة أخرى</div></div>`},
 {t:'أحل: أمثّل بالأشياء',say:'اضغط لتدخل النملتين الجديدتين إلى البيت، ثم عُدّ.',body:()=>`<div id="an" class="ems-box big">${ems('🐜',8)}</div><button class="btn" id="add">أدخل نملة</button><div class="big-eq" id="ae"></div>`,
  mount(el){let k=0;el.querySelector('#add').onclick=()=>{if(k<2){k++;sPop();el.querySelector('#an').innerHTML=ems('🐜',8)+' '+ems('🐜',k).replace('class="ems"','class="ems new"');if(k===2){el.querySelector('#ae').textContent='٨ + ٢ = ١٠ نملات';sGood();}}};}},
 {t:'جرّب',say:'هناك ٣ حشرات على ورقة شجرة. إذا انضمّ إليها ٨ حشرات أخرى، فكم حشرة أصبحت على الورقة؟',body:()=>`${ems('🐞',3)} ${ems('🐞',8)}`,check:{q:'كم حشرة أصبحت على الورقة؟',opts:[11,5,10],ans:11,hint:'ابدأ بالأكبر ٨ وعُدّ ٣.',why:'٣ + ٨ = ١١ حشرة'}},
 {t:'تذكّر دائمًا',say:'عندما تكون المسألة صعبة، مثّلها بأشياء حقيقية: أقلام، مكعبات، أو رسم.',body:()=>`<ul class="summary"><li>أقرأ المسألة وأحدد المطلوب.</li><li>أمثّل بأشياء: مكعبات، أقلام، أزرار.</li><li>أعدّ الأشياء كلها.</li><li>أتحقق: هل الإجابة معقولة؟</li></ul>`}],
levels:[
 [G2('أمثّل المسألة',2,()=>{const t=pick(THINGS),a=rnd(2,7),b=rnd(1,5);return choice(`على الطاولة ${ar(a)} ${t[2]}، ثم وضعنا ${ar(b)} أخرى. كم أصبح العدد؟`,sumOpts(a,b),a+b,'عُدّ كل الأشياء في الصورة.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,{visual:ems(t[0],a)+' ➕ '+ems(t[0],b)});}),
  G2('أمثّل المسألة',2,()=>{const t=pick(THINGS),a=rnd(3,9);return choice(`في الصندوق ${ar(a)} ${t[2]}، ولم نضع شيئًا جديدًا. كم في الصندوق؟`,[a,a+1,0],a,'إذا لم نضف شيئًا فالعدد لا يتغيّر.',`${ar(a)} + ٠ = ${ar(a)}`,{visual:ems(t[0],a)});})],
 [G2('أحل مسائل لفظية',3,()=>{const t=pick(THINGS),a=rnd(4,9),b=rnd(2,7);return input(`كان عند ${pick(NB)} ${ar(a)} ${t[2]}، ثم أعطاه أبوه ${ar(b)}. كم أصبح عنده؟`,a+b,'مثّلها بأصابعك أو بأشياء من حولك.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`);}),
  G2('أمثّل المسألة',2,()=>{const t=pick(THINGS),a=rnd(5,9),b=rnd(2,6);return input(`وقفت ${ar(a)} ${t[2]} على زهرة، ثم انضمّت إليها ${ar(b)}. كم أصبحت؟`,a+b,'ابدأ بالأكبر وعُدّ.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,{visual:ems(t[0],a)});})],
 [G2('أحل مسائل لفظية',3,()=>{const a=rnd(3,8),b=rnd(2,6);return input(`عند أمل ${ar(a)} طائرات ورقية، وعند ابتسام العدد نفسه. ثم اشترت أمل ${ar(b)} أخرى. كم طائرة عند أمل الآن؟`,a+b,'انتبه: السؤال عن أمل فقط.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`);}),
  G2('أحل مسائل لفظية',3,()=>{const a=rnd(3,8),b=rnd(3,8);return choice(`في الخلية ${ar(a)} نحلات، ودخلت ${ar(b)} نحلات. أي جملة عددية تحل المسألة؟`,[`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,`${ar(a)} − ${ar(b)} = ${ar(Math.abs(a-b))}`,`${ar(a)} + ${ar(b)} = ${ar(a+b+1)}`],`${ar(a)} + ${ar(b)} = ${ar(a+b)}`,'دخلت يعني زادت: نجمع.',`${ar(a)} + ${ar(b)} = ${ar(a+b)}`);})]],
play:playModel});

  G2('أجمع العدد ونفسه',0,()=>{const n=pick([2,4,5]),e={2:['👀','عينان'],4:['🕷️','أرجل العنكبوت: ٤ و ٤'],5:['🖐️🖐️','أصابع اليدين']}[n];return choice(`${e[1]}. كم المجموع؟ (${ar(n)} + ${ar(n)})`,nopts(2*n),2*n,'العدد مرتين.',`${ar(n)} + ${ar(n)} = ${ar(2*n)}`,{visual:`<span style="font-size:56px">${e[0]}</span>`});})],

function runSprint(body,m){runId++;const id=runId;let t=60,sc=0,cur,val='',miss=0;
 body.innerHTML=`<div class="panel" style="--c:var(--ones)"><div class="drill-top"><span class="sprint-t" id="st">⏱ ${ar(60)}</span><span style="font-weight:800">${SPM[m][0]} · النقاط: <span id="ss" class="num">٠</span></span></div>
  <div class="q"><div class="big-eq" id="sq" style="font-size:clamp(40px,10vw,60px);direction:rtl"></div><div class="ansfield" id="af">&nbsp;</div><div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-d="${d}">${ar(d)}</button>`).join('')}<button class="del" data-x="del">امسح</button></div></div></div>`;
 const q=s=>body.querySelector(s),af=q('#af');const upd=()=>af.innerHTML=val?ar(val):'&nbsp;';
 const next=()=>{cur=SPM[m][1]();val='';q('#sq').textContent=cur[0]+' = ؟';upd();};
 const press=d=>{if(t<=0)return;val+=d;upd();const target=String(cur[1]);if(val===target){sc++;sPop();q('#ss').textContent=ar(sc);af.classList.add('right');setTimeout(()=>{af.classList.remove('right');if(t>0)next();},140);}else if(val.length>=target.length||!target.startsWith(val)){miss++;sBad();af.classList.add('wrong');setTimeout(()=>{af.classList.remove('wrong');val='';upd();},280);}};
 body.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(b.dataset.d!=null)press(b.dataset.d);else{val=val.slice(0,-1);upd();}});
 body._key=e=>{const k=toLatin(e.key);if(/^\d$/.test(k))press(k);else if(e.key==='Backspace'){val=val.slice(0,-1);upd();}};
 const end=()=>{body._key=null;const S=store.sprint||{};const rec=sc>(S[m]||0);S[m]=Math.max(S[m]||0,sc);store.sprint=S;save();if(rec&&sc>0){sWin();confetti();}
  body.innerHTML=`<div class="panel result pop">${face(rec?'wow':'happy')}<h2>${rec&&sc>0?'رقم قياسي جديد!':'انتهى الوقت'}</h2><div class="score num">${ar(sc)}</div><p>حقيقة صحيحة في دقيقة واحدة${miss?` (و ${ar(miss)} محاولات خاطئة)`:''}. رقمك القياسي: ${ar(S[m])}.</p><div class="ctrl"><button class="btn" id="again">مرة أخرى</button><button class="btn alt" id="menu">نوع آخر</button></div></div>`;
  q('#again').onclick=()=>runSprint(body,m);q('#menu').onclick=()=>sprintMenu(body);};
 const iv=setInterval(()=>{if(id!==runId){clearInterval(iv);return;}t--;const st=q('#st');if(st)st.textContent='⏱ '+ar(t);if(t<=10&&st)st.classList.add('low');if(t<=0){clearInterval(iv);end();}},1000);
 next();}

function getCol(l){return ({1:'#F2862B',2:'#1C8FD0',3:'#8B5CF6',4:'#1E9E63',5:'#E2475A'})[l.id];}
function openLesson(id){const tab=!store.story[id]?'learn':lvCount(id)<3?'drill':'test';go({name:'lesson',id,tab,step:0});}

function renderLesson(){const l=L.find(x=>x.id===view.id),tab=view.tab||'learn';
 app.innerHTML=topbar()+`<div style="--c:${l.color}"><div class="lhead"><button class="back" id="bk">→ الدروس</button><span class="code">${l.code}</span><h1>${l.title}</h1></div>
  <div class="tabs" role="tablist">${[['learn','١ الشرح'],['play','٢ ألعب'],['drill','٣ أتدرّب'],['test','٤ الاختبار']].map(([k,n])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-t="${k}">${n}${k==='drill'?` <small>${ar(lvCount(l.id))}/٣</small>`:''}${k==='test'&&passedTest(l.id)?' <small>✓</small>':''}</button>`).join('')}</div><div id="body"></div></div>`;
 bindTop();$('#bk').onclick=()=>go({name:'math'});app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{view.tab=b.dataset.t;view.step=0;render();});
 const body=$('#body');if(tab==='learn')storyPlayer(body,l);else if(tab==='play')l.play(body);else if(tab==='test')testIntro(body,l);else levelPicker(body,l);}

/* ----- story player ----- */
function storyPlayer(root,l){const steps=l.story,n=steps.length;let i=view.step||0;
 const show=()=>{runId++;hush();const id=runId;view.step=i;const s=steps[i];const last=i===n-1;
  root.innerHTML=`<div class="panel"><div class="sp-top"><div class="sbar"><i style="width:${(i+1)/n*100}%"></i></div><span>${ar(i+1)} / ${ar(n)}</span></div>
   <h2 class="sp-title">${s.t}</h2><p class="sp-say">${s.say}</p>
   <div class="sp-body pop">${s.body()}</div>
   ${s.check?`<div class="check"><span class="ql">سؤال سريع</span><div class="qq">${s.check.q}</div>${s.check.visual?`<div style="max-width:100%;overflow-x:auto">${s.check.visual()}</div>`:''}<div class="opts">${s.check.opts.map(o=>`<button class="opt ${/^\d+$/.test(o)?'n':''}" data-v="${o}">${/^\d+$/.test(o)?ar(o):o}</button>`).join('')}</div><div id="cf" style="width:100%"></div></div>`:''}
   <div class="sp-nav"><button class="btn alt" id="prev" ${i===0?'disabled':''}>→ السابق</button>${voiceOK()?'<button class="say-btn" id="lis">🔊 اسمع الشرح</button>':''}<button class="btn ${last?'go':''}" id="next" ${s.check?'disabled':''}>${last?'انتهيت! إلى النشاط':'التالي ←'}</button></div></div>`;
  const q=x=>root.querySelector(x);
  if(s.mount)s.mount(q('.sp-body'),id);
  if(q('#lis'))q('#lis').onclick=()=>speak(s.say);
  if(readOn)setTimeout(()=>{if(id===runId)speak(s.say);},250);
  q('#prev').onclick=()=>{if(i>0){i--;show();}};
  q('#next').onclick=()=>{if(last){store.story[l.id]=1;save();view.tab='play';render();window.scrollTo({top:0,behavior:'smooth'});}else{i++;show();window.scrollTo({top:0,behavior:'smooth'});}};
  if(s.check){let tries=0;const c=s.check;root.querySelectorAll('.check .opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=String(b.dataset.v)===String(c.ans);
    if(ok){sGood();b.classList.add('right');root.querySelectorAll('.check .opt').forEach(x=>x.disabled=true);q('#cf').innerHTML=`<div class="feedback ok pop fbrow">${face('happy')}<div class="fbc"><strong>${pick(GOOD)}</strong><div>${c.why}</div></div></div>`;q('#next').disabled=false;}
    else{sBad();tries++;b.classList.add('wrong');b.disabled=true;if(tries===1){q('#cf').innerHTML=`<div class="hintbox pop"><b>فكّر مرة أخرى:</b> ${c.hint}</div>`;if(readOn)speak(c.hint);}
      else{root.querySelectorAll('.check .opt').forEach(x=>{x.disabled=true;if(String(x.dataset.v)===String(c.ans))x.classList.add('right');});q('#cf').innerHTML=`<div class="feedback bad pop"><strong>لا بأس، هذا هو الجواب</strong><div>${c.why}</div></div>`;q('#next').disabled=false;}}});}
 };show();}

/* ----- levels ----- */
const LVN=[['سهل','أسئلة قصيرة مع صور ومساعدة.'],['متوسط','أعداد أكبر وكتابة الإجابة بنفسك.'],['صعب','مسائل وتفكير. للأبطال!']];
function levelPicker(root,l){const done=lvCount(l.id);
 root.innerHTML=`<div class="panel"><h2>تدريب مكثّف</h2><p style="margin:0 0 12px;color:var(--muted)">كل مستوى ١٠ أسئلة جديدة في كل مرة. أجب عن ٨ إجابات صحيحة من المحاولة الأولى لتفتح المستوى التالي. إذا أخطأت، تأتيك مساعدة وفرصة ثانية.</p>
 <div class="levels">${LVN.map(([n,d],k)=>{const lv=k+1,locked=lv>done+1,passed=lv<=done;return `<button class="lvl${locked?' locked':''}${passed?' passed':''}" data-lv="${lv}" ${locked?'aria-disabled="true"':''}><h3>${ar(lv)}. ${n}</h3><p>${d}</p><span class="st">${passed?'<span style="color:var(--leaf)">★ اجتزته</span>'+(store.best[l.id+'-'+lv]!=null?` · أفضل نتيجة ${ar(store.best[l.id+'-'+lv])}/١٠`:''):locked?'مغلق: اجتز المستوى السابق':'ابدأ الآن ←'}</span></button>`;}).join('')}</div>
 ${!store.story[l.id]?`<div class="tip">ننصح بمشاهدة <b>الشرح</b> أولًا.</div>`:''}</div>`;
 root.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{const lv=+b.dataset.lv;if(lv>lvCount(l.id)+1){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return;}
  runDrill(root,{key:l.id,lv,gens:l.levels[lv-1],total:10,pass:8,color:l.color,onBack:()=>levelPicker(root,l),onNext:lv<3?()=>runDrillLv(root,l,lv+1):null,after3:{label:'إلى اختبار الدرس ←',fn:()=>{view.tab='test';render();}}});});}
function runDrillLv(root,l,lv){runDrill(root,{key:l.id,lv,gens:l.levels[lv-1],total:10,pass:8,color:l.color,onBack:()=>levelPicker(root,l),onNext:lv<3?()=>runDrillLv(root,l,lv+1):null,after3:{label:'إلى اختبار الدرس ←',fn:()=>{view.tab='test';render();}}});}


const GOOD=['أحسنت يا محمد!','ممتاز!','رائع يا بطل!','إجابة صحيحة!','عمل جميل!','أنت مبدع!'];
const RETRY=['قريب! جرّب مرة أخرى','فكّر قليلًا، وحاول ثانية','لا بأس، اقرأ المساعدة وجرّب'];
/* ================= shared question UI ================= */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
const isRight=(cur,g)=>cur.kind==='input'?+g===+cur.answer:norm(g)===norm(cur.answer);
function optsHTML(cur){if(cur.layout==='line')return `<div class="nlopts">${cur.options.map((o,k)=>`<button class="opt nlo" data-k="${k}"><i></i>${ar(o)}</button>`).join('')}</div>`;const isNum=!cur.optHtml&&cur.options.every(o=>/^\d+$/.test(o));
 return `<div class="opts${cur.optHtml?' picopts':''}">${cur.options.map((o,k)=>`<button class="opt${cur.optHtml?' pic':isNum?' n':''}" data-k="${k}">${cur.optHtml?cur.optHtml[o]:isNum?ar(o):o}</button>`).join('')}</div>`;}
const showAns=(cur,v)=>cur.optHtml&&cur.optHtml[v]!=null?`<span class="mini">${cur.optHtml[v]}</span>`:/^\d+$/.test(String(v))?ar(v):cur.kind==='tiles'?`<span class="en">${esc(v)}</span>`:v;
function hasAudio(cur){return cur.sayEn?enOK():voiceOK();}
function audioTools(cur,hint){const a=hasAudio(cur);return `<div class="qtools">${a?`<button class="say-btn" data-play="0">🔊 ${cur.sayEn?'استمع':'اقرأ السؤال'}</button>`:''}${a&&cur.sayEn?'<button class="say-btn" data-play="1">🐢 ببطء</button>':''}${hint?'<button class="say-btn" id="hintq">💡 مساعدة</button>':''}</div>`;}
function playQ(cur,slow){if(cur.sayEn)return speakEn(cur.sayEn,slow);speak(cur.autoSay?cur.say:(cur.say||cur.prompt));}
function bindAudio(root,cur){root.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playQ(cur,b.dataset.play==='1'));root.querySelectorAll('[data-sayq]').forEach(b=>b.onclick=()=>speak(cur.say));
 if(cur.autoSay&&hasAudio(cur))setTimeout(()=>playQ(cur),350);else if(!cur.sayEn&&readOn&&voiceOK())setTimeout(()=>speak(cur.say||cur.prompt),300);}
function tilesUI(el,cur,onChange){const order=shuffle(cur.tiles.map((_,i)=>i));let picked=[];
 const api={get:()=>picked.map(i=>cur.tiles[i]).join(cur.joiner),full:()=>picked.length===cur.tiles.length,reset:()=>{picked=[];draw();},locked:false};
 const draw=()=>{el.innerHTML=`<div class="tiles-wrap"><div class="tslots${cur.joiner===''?' letters':''}">${cur.tiles.map((_,k)=>`<span class="tslot${picked[k]!=null?' on':''}">${picked[k]!=null?esc(cur.tiles[picked[k]]):''}</span>`).join('')}</div>
  <div class="tiles">${order.map(i=>`<button class="tile" data-i="${i}" ${picked.includes(i)?'disabled':''}>${esc(cur.tiles[i])}</button>`).join('')}</div><button class="btn small alt" data-undo ${picked.length?'':'disabled'}>⌫ تراجع</button></div>`;
  el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(api.locked)return;picked.push(+b.dataset.i);sTap();draw();onChange&&onChange();});
  el.querySelector('[data-undo]').onclick=()=>{if(api.locked)return;picked.pop();draw();onChange&&onChange();};};
 draw();return api;}

/* ================= practice engine (hints + second try) ================= */
function runDrill(body,cfg){runId++;
 const q=[];let last=null;for(let i=0;i<cfg.total;i++){let g,t=0;do{g=pick(cfg.gens);}while(g===last&&++t<6);last=g;q.push({g,base:true});}
 let idx=0,score=0,streak=0,extra=0,cur,marks=[];
 const show=()=>{if(idx>=q.length)return finish();hush();const it=q[idx];cur=it.g();let tries=0,hintUsed=false,tiles=null;
  const dots=q.map((x,i)=>`<i class="${i<idx?marks[i]:i===idx?'now':''}"></i>`).join('');
  body.innerHTML=`<div class="panel" style="--c:${cfg.color}"><div class="drill-top"><div class="dots">${dots}</div><span style="font-weight:800">${cfg.lv?'المستوى '+ar(cfg.lv)+' · ':cfg.skillName?'تدريب: '+cfg.skillName+' · ':''}السؤال ${ar(Math.min(idx+1,q.length))} من ${ar(q.length)}${streak>=3?' · متتالية '+ar(streak):''}</span></div>
   <div class="q pop">${!it.base?'<span class="pill">سؤال مراجعة</span>':''}<div class="prompt">${cur.prompt}</div>
    ${cur.visual?`<div class="qvis">${cur.visual}</div>`:''}${cur.visualText||''}${audioTools(cur,true)}
    <div id="ans" class="answ"></div><div id="hb" class="answ"></div><div id="fb" class="answ"></div></div></div>`;
  const $$=s=>body.querySelector(s);bindAudio(body,cur);const ans=$$('#ans');
  const showHint=()=>{hintUsed=true;$$('#hb').innerHTML=`<div class="hintbox pop"><b>مساعدة:</b> ${cur.hint}</div>`;if(readOn&&!cur.sayEn)speak(cur.hint);};
  $$('#hintq').onclick=()=>{sTap();showHint();};
  const finishQ=ok=>{bumpDay();ans.dataset.done=1;if(tiles)tiles.locked=true;$$('#hintq').disabled=true;const first=ok&&tries===0&&!hintUsed;marks[idx]=first?'ok':ok?'half':'bad';
   if(ok){sGood();streak++;store.correct++;if(first&&it.base)score++;}else{sBad();streak=0;}
   if(cur.sayEn&&enOK())setTimeout(()=>speakEn(cur.sayEn),500);
   if(!first&&extra<5){q.push({g:it.g,base:false});extra++;}save();
   $$('#hb').innerHTML='';
   $$('#fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'} pop fbrow">${face(ok?'happy':'think')}<div class="fbc"><strong>${ok?(first?pick(GOOD):'صحيح! أحسنت المحاولة'):'هذا هو الجواب الصحيح'}</strong>${!ok&&cur.kind==='tiles'?`<div class="en" style="font-size:26px;font-weight:700">${esc(cur.answer)}</div>`:''}<div>${cur.explain}</div>${!first?'<div>سيأتيك سؤال يشبهه في آخر الجولة لتتقنه.</div>':''}<div><button class="btn" id="nx">${idx+1>=q.length?'النتيجة':'السؤال التالي ←'}</button></div></div></div>`;
   const nx=$$('#nx');nx.focus({preventScroll:true});nx.onclick=()=>{idx++;show();};if(first&&streak>0&&streak%5===0)confetti();};
  const wrongOnce=()=>{tries++;sBad();$$('#fb').innerHTML=`<div class="hintbox pop" style="background:var(--bad-bg);border-color:var(--berry)"><b>${pick(RETRY)}</b></div>`;showHint();};
  if(cur.kind==='choice'){ans.innerHTML=optsHTML(cur);
   ans.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(ans.dataset.done||b.disabled)return;const v=cur.options[+b.dataset.k],ok=v===cur.answer;
    if(ok){b.classList.add('right');ans.querySelectorAll('.opt').forEach(x=>x.disabled=true);$$('#fb').innerHTML='';finishQ(true);}
    else{b.classList.add('wrong');b.disabled=true;const left=[...ans.querySelectorAll('.opt')].filter(x=>!x.disabled);
     if(tries===0&&left.length>1)wrongOnce();else{ans.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(cur.options[+x.dataset.k]===cur.answer)x.classList.add('right');});finishQ(false);}}});}
  else if(cur.kind==='tiles'){const box=document.createElement('div');box.style.width='100%';ans.appendChild(box);const chk=document.createElement('button');chk.className='btn go';chk.id='tchk';chk.textContent='تحقّق';chk.disabled=true;ans.appendChild(chk);ans.classList.add('col');
   tiles=tilesUI(box,cur,()=>{chk.disabled=!tiles.full();});
   chk.onclick=()=>{if(ans.dataset.done||!tiles.full())return;if(isRight(cur,tiles.get())){chk.remove();finishQ(true);}else if(tries===0){tiles.reset();chk.disabled=true;wrongOnce();}else{chk.remove();finishQ(false);}};}
  else{let val='';ans.innerHTML=`<div class="answer-box"><div class="ansfield" id="af">&nbsp;</div><div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-d="${d}">${ar(d)}</button>`).join('')}<button class="del" data-x="del">امسح</button><button class="wide" data-x="ok">تحقّق</button></div></div>`;
   const af=$$('#af'),upd=()=>af.innerHTML=val?ar(val):'&nbsp;';
   const submit=()=>{if(ans.dataset.done||!val)return;const ok=+val===+cur.answer;
    if(ok){af.className='ansfield right';finishQ(true);}else if(tries===0){af.className='ansfield wrong shake';setTimeout(()=>{af.className='ansfield';val='';upd();},600);wrongOnce();}
    else{af.className='ansfield wrong';af.innerHTML=`<s style="opacity:.5">${ar(val)}</s>&nbsp;→&nbsp;${ar(cur.answer)}`;finishQ(false);}};
   ans.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(ans.dataset.done)return;sTap();if(b.dataset.d!=null){if(val.length<3)val+=b.dataset.d;}else if(b.dataset.x==='del')val=val.slice(0,-1);else return submit();upd();});
   body._key=e=>{if(ans.dataset.done)return;const k=toLatin(e.key);if(/^\d$/.test(k)&&val.length<3){val+=k;upd();}else if(e.key==='Backspace'){val=val.slice(0,-1);upd();}else if(e.key==='Enter')submit();};}
 };
 const finish=()=>{body._key=null;hush();const passed=score>=cfg.pass;if(cfg.onFinish)cfg.onFinish(score,passed);
  if(cfg.lv&&passed&&cfg.lv>lvCount(cfg.key))store.lv[cfg.key]=cfg.lv;
  const bk=cfg.key+(cfg.lv?'-'+cfg.lv:'');store.best[bk]=Math.max(store.best[bk]||0,score);store.rounds[bk]=(store.rounds[bk]||0)+1;save();
  if(passed){sWin();confetti();}
  const msg=cfg.doneMsg?cfg.doneMsg(passed):cfg.skillName?(passed?'أحسنت! أصبحت أقوى في هذه المهارة. أعد الاختبار الآن.':'جرّب جولة أخرى على هذه المهارة.')
   :passed?(cfg.lv===3?'أنهيت المستويات الثلاثة! أنت جاهز للاختبار.':'ممتاز! فتحت المستوى التالي.'):`تحتاج ${ar(cfg.pass)} إجابات صحيحة من أول محاولة. أنت قريب، جرّب جولة جديدة!`;
  body.innerHTML=`<div class="panel result pop" style="--c:${cfg.color}">${face(passed?'wow':'think')}<h2>${passed?'أحسنت يا محمد!':'انتهت الجولة'}</h2><div class="score num">${ar(score)} / ${ar(cfg.total)}</div><p>${msg}</p>
   <div class="ctrl">${passed&&cfg.onNext?'<button class="btn go" id="nxt">المستوى التالي ←</button>':''}${passed&&cfg.lv===3&&cfg.after3?`<button class="btn go" id="totest">${cfg.after3.label}</button>`:''}<button class="btn ${passed&&(cfg.onNext||cfg.after3)?'alt':''}" id="again">جولة جديدة</button><button class="btn alt" id="bk2">رجوع</button></div></div>`;
  $('#again').onclick=()=>runDrill(body,cfg);$('#bk2').onclick=()=>cfg.onBack();if($('#nxt'))$('#nxt').onclick=cfg.onNext;if($('#totest'))$('#totest').onclick=cfg.after3.fn;
  const tb=document.querySelector('.top');if(tb){tb.outerHTML=topbar();bindTop();}
  if(cfg.lv)document.querySelectorAll('[data-t="drill"] small').forEach(s=>s.textContent=ar(lvCount(cfg.key))+'/٣');};
 show();}

/* ================= test engine (no hints, report at the end) ================= */
function runTest(body,cfg){runId++;hush();
 const items=cfg.make().map(it=>Object.assign({},it,{q:it.g()})),n=items.length,answers=[];let idx=0;
 const show=()=>{hush();if(idx>=n)return report();const cur=items[idx].q;let sel=null,val='',tiles=null;
  body.innerHTML=`<div class="panel" style="--c:${cfg.color}"><div class="drill-top"><div class="dots">${items.map((x,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join('')}</div><span style="font-weight:800">${cfg.title} · السؤال ${ar(idx+1)} من ${ar(n)}</span></div>
   <div class="q pop"><div class="prompt">${cur.prompt}</div>${cur.visual?`<div class="qvis">${cur.visual}</div>`:''}${cur.visualText||''}${audioTools(cur,false)}
   <div id="ans" class="answ"></div><div class="ctrl"><button class="btn" id="nx" disabled>${idx+1===n?'أنهِ الاختبار ✓':'التالي ←'}</button></div></div></div>`;

const ENU={0:{t:'Introduction',ar:'المقدمة'},1:{t:'Unit 1 · Feelings',ar:'الوحدة ١: المشاعر'},2:{t:'Unit 2 · Things We Wear',ar:'الوحدة ٢: ما نلبسه'},3:{t:'Unit 3 · Things We Do',ar:'الوحدة ٣: ما نفعله'}};
const REPLY_POOL=EN.flatMap(l=>(l.replies||[]).map(r=>r[1]));

/* ---------- question generators ---------- */
const G=(skill,fn)=>{fn.skill=skill;return fn;};
const pics=L=>L.items.filter(w=>w.pic);
function others(L,w,n,pool){const base=(pool||pics(L)).filter(x=>x.en!==w.en);const same=base.filter(x=>(x.set||'')===(w.set||'')&&(x.g||0)===(w.g||0));const src=same.length>=n?same:base;return shuffle(src).slice(0,n);}
const picOpts=arr=>Object.fromEntries(arr.map(x=>[x.en,picHTML(x,'opt-pic')]));
const enOpts=arr=>Object.fromEntries(arr.map(x=>[x,`<span class="en">${esc(x)}</span>`]));
const spellable=L=>L.items.filter(w=>/^[A-Za-z]{3,8}$/.test(w.en));

function gWordPic(L){return G('القراءة',()=>{const w=pick(pics(L)),o=[w,...others(L,w,2)];return{prompt:`اقرأ واختر الصورة: ${enB(w.en)}`,kind:'choice',options:shuffle(o.map(x=>x.en)),optHtml:picOpts(o),answer:w.en,sayEn:w.en,hint:`${enS(w.en)} معناها «${w.ar}».`,explain:`${enS(w.en)} = ${w.ar}`};});}
function gListenPic(L){const rd=gWordPic(L);return G('الاستماع',()=>{if(!enOK())return rd();const w=pick(pics(L)),o=[w,...others(L,w,2)];return{prompt:'استمع واختر الصورة الصحيحة',kind:'choice',options:shuffle(o.map(x=>x.en)),optHtml:picOpts(o),answer:w.en,sayEn:w.en,autoSay:true,hint:'اضغط 🐢 لتسمعها ببطء، وركّز على أول صوت.',explain:`${enS(w.en)} = ${w.ar}`};});}
function gPicWord(L){return G('القراءة',()=>{const w=pick(pics(L)),o=[w,...others(L,w,2)].map(x=>x.en);return{prompt:'ما الكلمة المناسبة للصورة؟',visual:picHTML(w,'xl'),kind:'choice',options:shuffle(o),optHtml:enOpts(o),answer:w.en,hint:`معناها «${w.ar}». ابحث عن الكلمة التي تُنطق: ${w.tr}`,explain:`${enS(w.en)} = ${w.ar}`};});}
function gMeaning(L){return G('المفردات',()=>{const w=pick(L.items),o=[w,...others(L,w,2,L.items)];return{prompt:`ما معنى ${enB(w.en)}؟`,sayEn:w.en,kind:'choice',options:shuffle(o.map(x=>x.ar)),answer:w.ar,hint:w.pic?`انظر: ${picHTML(w,'mini')}`:`تُنطق: ${w.tr}`,explain:`${enS(w.en)} = ${w.ar}`};});}
function gArEn(L){return G('المفردات',()=>{const w=pick(L.items),o=[w,...others(L,w,2,L.items)].map(x=>x.en);return{prompt:`كيف نقول «${w.ar}» بالإنجليزية؟`,kind:'choice',options:shuffle(o),optHtml:enOpts(o),answer:w.en,hint:`تُنطق تقريبًا: ${w.tr}`,explain:`«${w.ar}» = ${enS(w.en)}`};});}
function gListenWord(L){const rd=gArEn(L);return G('الاستماع',()=>{if(!enOK())return rd();const w=pick(L.items),o=[w,...others(L,w,2,L.items)].map(x=>x.en);return{prompt:'استمع واختر ما سمعته',kind:'choice',options:shuffle(o),optHtml:enOpts(o),answer:w.en,sayEn:w.en,autoSay:true,hint:'استمع ببطء 🐢 وقارن أول كلمة.',explain:`سمعت: ${enS(w.en)} (${w.ar})`};});}
function gMissing(L){return G('التهجئة',()=>{const w=pick(spellable(L)),s=w.en;const pos=rnd(0,s.length-1),c=s[pos].toLowerCase();const pool='abcdeghiklmnoprstuwy'.split('').filter(x=>x!==c);const o=shuffle([c,...shuffle(pool).slice(0,2)]);
 const shown=s.split('').map((ch,i)=>i===pos?'<span class="blank">_</span>':esc(ch)).join('');return{prompt:'ما الحرف الناقص؟',visual:`<div class="row">${w.pic?picHTML(w,'big'):''}<div class="enword en">${shown}</div></div>`,sayEn:w.en,kind:'choice',options:o,optHtml:enOpts(o),answer:c,hint:'استمع للكلمة 🔊 وانتبه لهذا الصوت.',explain:`الكلمة: ${enS(s)}`};});}
function gSpell(L){return G('التهجئة',()=>{const w=pick(spellable(L));return{prompt:'رتّب الحروف لتكتب الكلمة',visual:w.pic?picHTML(w,'big'):'',sayEn:w.en,kind:'tiles',tiles:w.en.split(''),joiner:'',answer:w.en,hint:`أول حرف هو ${enS(w.en[0])}`,explain:`${enS(w.en)} = ${w.ar}`};});}
function gBuild(L,list){return G('المحادثة',()=>{const s=pick(list||L.build);const parts=s.split(' ');const arT=trAr(s);return{prompt:`رتّب الكلمات لتكوّن الجملة${arT?`: «${arT}»`:''}`,sayEn:s,kind:'tiles',tiles:parts,joiner:' ',answer:s,hint:`استمع للجملة 🔊. أول كلمة: ${enS(parts[0])}`,explain:`${enS(s)}`};});}
function gReply(L){return G('المحادثة',()=>{const[qq,a]=pick(L.replies);const o=[a,...shuffle(REPLY_POOL.filter(x=>x!==a&&x!==qq)).slice(0,2)];return{prompt:`قال لك صديقك: ${enB(qq)}<br>بماذا تردّ؟`,sayEn:qq,kind:'choice',options:shuffle(uniq(o)),optHtml:enOpts(o),answer:a,hint:`${enS(qq)} معناها: ${(L.items.find(x=>x.en===qq)||{}).ar||trAr(qq)}`,explain:`${enS(qq)} ← ${enS(a)}`};});}
function trAr(s){for(const l of EN)for(const w of l.items)if(w.en===s)return w.ar;for(const l of EN)for(const d of (l.dialog||[]))if(d[1]===s)return d[2];return '';}
function gSentPic(L){const rd=G('القراءة',()=>{const w=pick(pics(L).filter(x=>x.ex)),o=[w,...others(L,w,2)];return{prompt:`اقرأ واختر الصورة: ${enB(w.ex)}`,kind:'choice',options:shuffle(o.map(x=>x.en)),optHtml:picOpts(o),answer:w.en,sayEn:w.ex,hint:`${enS(w.en)} = ${w.ar}`,explain:`${enS(w.ex)}`};});
 return G('الاستماع',()=>{if(!enOK())return rd();const w=pick(pics(L).filter(x=>x.ex)),o=[w,...others(L,w,2)];return{prompt:'استمع للجملة واختر الصورة',kind:'choice',options:shuffle(o.map(x=>x.en)),optHtml:picOpts(o),answer:w.en,sayEn:w.ex,autoSay:true,hint:'آخر كلمة في الجملة هي المهمة.',explain:`${enS(w.ex)} = ${w.ar}`};});}
function gFirstSound(L){return G('الأصوات',()=>{const w=pick(L.items.filter(x=>x.snd)),o=L.groups[w.g];const audio=enOK();return{prompt:audio?'استمع: بأي صوت تبدأ الكلمة؟':`بأي صوت تبدأ الكلمة ${enB(w.en)}؟`,visual:picHTML(w,'big'),sayEn:w.en,autoSay:audio,kind:'choice',options:shuffle(o.slice()),optHtml:enOpts(o),answer:w.snd,hint:`قلها ببطء: ${w.tr}`,explain:`${enS(w.en)} تبدأ بـ ${enS(w.snd)}`};});}
function gPair(L){return G('الأصوات',()=>{const pr=pick(L.pairs),t=pick(pr),w=L.items.find(x=>x.en===t);if(!enOK())return{prompt:`أي كلمة معناها «${w.ar}»؟`,visual:picHTML(w,'big'),kind:'choice',options:shuffle(pr.slice()),optHtml:enOpts(pr),answer:t,hint:'الكلمة التي تنتهي بـ e يقول فيها الحرف اسمه.',explain:`${enS(t)} = ${w.ar}`};
 return{prompt:'استمع جيدًا: أي كلمة تسمع؟',sayEn:t,autoSay:true,kind:'choice',options:shuffle(pr.slice()),optHtml:enOpts(pr),answer:t,hint:'إذا سمعت الحرف يقول اسمه (إي / آي) فالكلمة تنتهي بـ e.',explain:`سمعت ${enS(t)} (${w.ar})`};});}
function gOrdinal(L){const o=L.items.filter(x=>x.set==='o');return G('المفردات',()=>{const w=pick(o),d=others(L,w,2,o);if(Math.random()<.5){const opts=[w,...d].map(x=>x.en);return{prompt:`كيف نقول ${enB(w.pic.slice(4))} بالكلمات؟`,kind:'choice',options:shuffle(opts),optHtml:enOpts(opts),answer:w.en,sayEn:w.en,hint:`${w.pic.slice(4)} = ${w.ar}`,explain:`${enS(w.pic.slice(4))} = ${enS(w.en)} = ${w.ar}`};}
 const L8='ABCDEFGHIJ'[w.n-1],opts=[w,...d].map(x=>x.en);return{prompt:`الحرف ${enB(L8)} هو الحرف ... في الأبجدية`,visual:`<div class="abc en">${'ABCDEFGHIJ'.split('').map((c,i)=>`<span class="${i===w.n-1?'on':''}">${c}</span>`).join('')}</div>`,kind:'choice',options:shuffle(opts),optHtml:enOpts(opts),answer:w.en,sayEn:`${L8} is the ${w.en} letter.`,hint:'عُدّ الحروف من A.',explain:`${enS(`${L8} is the ${w.en} letter.`)} (${w.ar})`};});}
function gMatter(L){return G('المحادثة',()=>{const w=pick(L.items),o=[w,...others(L,w,2)].map(x=>`I'm ${x.en}.`);return{prompt:`${enB("What's the matter?")}<br>انظر إلى الصورة وأجب`,visual:picHTML(w,'xl'),sayEn:"What's the matter?",kind:'choice',options:shuffle(o),optHtml:enOpts(o),answer:`I'm ${w.en}.`,hint:`الصورة تعني: ${w.ar}`,explain:`${enS(`I'm ${w.en}.`)} = أنا ${w.ar}`};});}
function gTF(L){const acts=EN.find(x=>x.id==='u3c').items.concat(L.items.filter(x=>x.set==='s').map(x=>({en:x.en.replace(/^I'm /,'').replace('.',''),ar:x.ar,pic:x.pic})));
 return G('المحادثة',()=>{const w=pick(acts),tr=Math.random()<.5,c=tr?w:pick(acts.filter(x=>x.pic!==w.pic));const s=`I'm ${c.en}.`;const o=["I think it's true.","I think it's false."];return{prompt:`انظر إلى الصورة واستمع: ${enB(s)}<br>صح أم خطأ؟`,visual:picHTML(w,'xl'),sayEn:s,kind:'choice',options:o,optHtml:{[o[0]]:'<span class="en">True ✅</span>',[o[1]]:'<span class="en">False ❌</span>'},answer:tr?o[0]:o[1],hint:`الجملة تعني: ${c.ar||''}`,explain:tr?`صحيح: الصورة تعني ${w.ar}.`:`خطأ: الصورة تعني ${w.ar}، والجملة تقول ${c.ar}.`};});}
function gHeShe(L){return G('المحادثة',()=>{const w=pick(L.items),who=pick([['👦',"He's",'هو'],['👧',"She's",'هي'],['🙋',"I'm",'أنا']]);const cj=(p,e)=>`${p} ${e.replace('my homework',p==="He's"?'his homework':p==="She's"?'her homework':'my homework')}.`;const right=cj(who[1],w.en);const ow=pick(L.items.filter(x=>x!==w));const o=uniq([right,cj(who[1]==="He's"?"She's":"He's",w.en),cj(who[1],ow.en)]);return{prompt:'اختر الجملة المناسبة للصورة',visual:`<span class="pic xl">${who[0]}</span>${picHTML(w,'xl')}`,kind:'choice',options:shuffle(o),optHtml:enOpts(o),answer:right,sayEn:right,hint:`${who[0]} = ${who[2]} (${enS(who[1])})، و ${picHTML(w,'mini')} = ${w.ar}`,explain:`${enS(right)}`};});}

function buildLevels(L){let e,m,h;const T=L.type;
 if(T==='phrases'){e=[gListenPic(L),gMeaning(L),gWordPic(L)];m=[gArEn(L),gWordPic(L),gListenWord(L)];h=[gListenWord(L),gBuild(L)];if(L.replies){m.push(gReply(L));h.push(gReply(L));}}
 else if(T==='phonics'){e=[gListenPic(L),gMeaning(L),gFirstSound(L)];m=[gPicWord(L),gMissing(L),gFirstSound(L)];h=[gSpell(L),gListenWord(L),gMissing(L)];if(L.pairs){e.push(gPair(L));m.push(gPair(L));h.push(gPair(L));}}
 else{e=[gListenPic(L),gMeaning(L),gWordPic(L)];m=[gPicWord(L),gArEn(L),gListenWord(L)];h=[gBuild(L),gListenWord(L)];if(spellable(L).length>=3){m.push(gMissing(L));h.push(gSpell(L));}if(L.items.some(x=>x.ex)){m.push(gSentPic(L));h.push(gSentPic(L));}}
 if(L.id==='u1b'){const A={items:L.items.filter(x=>x.set==='a')};A.type='x';e=[gListenPic(A),gMeaning(A),gOrdinal(L)];m=[gOrdinal(L),gPicWord(A),gArEn(L),gListenWord(A)];h=[gOrdinal(L),gBuild(L),gSpell({items:L.items.filter(x=>x.set==='o')}),gListenWord(L)];}
 if(L.matter){m.push(gMatter(L));h.push(gMatter(L));}
 if(L.tf){m.push(gTF(L));h.push(gTF(L));}
 if(L.heShe){m.push(gHeShe(L));h.push(gHeShe(L));}
 if(L.id==='u2b'&&L.replies){m.push(gReply(L));}
 return [e,m,h];}
EN.forEach(L=>{L.levels=buildLevels(L);L.key='en-'+L.id;});

function enLearn(root,L){const steps=[{k:'intro'}];L.items.forEach(w=>steps.push({k:'card',w}));if(L.dialog)steps.push({k:'dialog'});if(L.chant)steps.push({k:'chant'});if(L.rules)L.rules.forEach(r=>steps.push({k:'rule',r}));steps.push({k:'check'},{k:'sum'});

  if(s.k==='intro'){title=L.ar;h=`<p class="sp-say">في هذا الدرس ${ar(L.items.length)} ${L.type==='phrases'?'جمل':'كلمات'}. لكل واحدة: اضغط 🔊 لتسمع، و🐢 لتسمع ببطء، ثم قلها بصوت عالٍ.</p><div class="chipsen">${L.items.map(w=>`<span class="en">${esc(w.en)}</span>`).join('')}</div>${enOK()?'':noVoiceNote()}`;}

   <div class="sp-nav"><button class="btn alt" id="prev" ${i===0?'disabled':''}>→ السابق</button><button class="btn ${last?'go':''}" id="next" ${s.k==='check'?'disabled':''}>${last?'انتهيت! أسمع وأردّد':'التالي ←'}</button></div></div>`;

function enPlay(root,L){const pool=pics(L).filter(w=>!w.pic.startsWith('txt:')||L.id==='u1b');
 root.innerHTML=`<div class="panel act"><h2>لعبة الذاكرة</h2><div>اقلب بطاقتين: صورة والكلمة التي تناسبها.</div><div class="mem" id="mem"></div><div class="msg" id="mm"></div><button class="btn alt" id="mnew">لعبة جديدة</button></div>

 const mem=()=>{const ch=shuffle(pool).slice(0,Math.min(6,pool.length));let cards=shuffle(ch.flatMap(w=>[{w,t:'p'},{w,t:'w'}])),open=[],done=0,moves=0,lock=false;

function enTestItems(lessons,perLesson,extra){const out=[];lessons.forEach(L=>{const pool=L.levels[1].concat(L.levels[2]);const used=new Set();for(let k=0;k<perLesson;k++){let g,t=0;do{g=pick(pool);}while(used.has(g.skill)&&++t<8);used.add(g.skill);out.push({g,grp:`${L.code} ${L.ar}`,skill:g.skill,rev:{name:'enl',id:L.id,tab:'learn',step:0},train:pool.filter(x=>x.skill===g.skill),color:L.color});}});
 if(extra){shuffle(lessons).slice(0,extra).forEach(L=>{const pool=L.levels[1].concat(L.levels[2]);const g=pick(pool);out.push({g,grp:`${L.code} ${L.ar}`,skill:g.skill,rev:{name:'enl',id:L.id,tab:'learn',step:0},train:pool.filter(x=>x.skill===g.skill),color:L.color});});}
 return out;}

function ring(n,goal){const p=Math.min(1,n/goal),C=2*Math.PI*34;return `<svg class="ring" viewBox="0 0 84 84" width="104" role="img" aria-label="هدف اليوم"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="42" cy="42" r="34" fill="none" stroke="${p>=1?'var(--sun)':'var(--leaf)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="42" text-anchor="middle" font-family="Baloo Bhaijaan 2,Tajawal,sans-serif" font-weight="800" font-size="22" fill="var(--ink)">${p>=1?'⭐':ar(n)}</text><text x="42" y="60" text-anchor="middle" font-family="Tajawal,sans-serif" font-size="11" fill="var(--muted)">من ${ar(goal)}</text></svg>`;}

/* ---------- adventure map ---------- */
function wrap2(t,n=13){const w=String(t).split(' ');const lines=[''];for(const x of w){const cur=lines[lines.length-1];if(cur&&(cur+' '+x).length>n)lines.push(x);else lines[lines.length-1]=(cur+' '+x).trim();}return lines.slice(0,2);}
const MINI_HEAD=`<g><rect x="0" y="0" width="34" height="32" rx="8" fill="var(--ones)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="11" cy="13" r="4.5" fill="#FFFFFF" stroke="var(--ink)" stroke-width="1.5"/><circle cx="23" cy="13" r="4.5" fill="#FFFFFF" stroke="var(--ink)" stroke-width="1.5"/><circle cx="12" cy="14" r="2" fill="#16264A"/><circle cx="24" cy="14" r="2" fill="#16264A"/><path d="M10 22q7 6 14 0" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/></g>`;
function advMap(nodes){const W=360,dy=104,xs=[285,180,75,180];const P=nodes.map((n,i)=>({x:xs[i%4],y:56+i*dy}));const H=P[P.length-1].y+92;
 let path=`M${P[0].x} ${P[0].y}`;for(let i=1;i<P.length;i++){const p=P[i-1],q=P[i];path+=` C${p.x} ${p.y+dy*.6} ${q.x} ${q.y-dy*.6} ${q.x} ${q.y}`;}
 let s=`<path d="${path}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path d="${path}" fill="none" stroke="var(--card)" stroke-width="4" stroke-dasharray="3 13" stroke-linecap="round"/>`;
 nodes.forEach((n,i)=>{const{x,y}=P[i],st=n.state;const fill=st==='done'?n.color:st==='cur'?'var(--card)':'var(--soft)';
  s+=`<g class="mnode ${st}" data-k="${n.key}" tabindex="0" role="button" aria-label="${n.label}">${st==='cur'?`<circle class="pulse" cx="${x}" cy="${y}" r="39" fill="none" stroke="${n.color}" stroke-width="4"/>`:''}
   <circle cx="${x}" cy="${y}" r="31" fill="${fill}" stroke="var(--ink)" stroke-width="3.5"/>
   <text x="${x}" y="${y+(n.icon?10:8)}" text-anchor="middle" class="mcode${n.icon?' ic':''}" fill="${st==='done'?'#FFFFFF':'var(--ink)'}">${n.icon||n.code}</text>
   ${wrap2(n.label).map((ln,k)=>`<text x="${x}" y="${y+52+k*17}" text-anchor="middle" class="mlab">${ln}</text>`).join('')}
   ${n.sub!=null?`<text x="${x}" y="${y+52+wrap2(n.label).length*17}" text-anchor="middle" class="msub">${n.sub}</text>`:''}
   ${st==='done'?`<g transform="translate(${x+18} ${y-34})"><circle cx="8" cy="8" r="11" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/><path d="M3 8l3.5 3.5L13 5" fill="none" stroke="#16264A" stroke-width="2.5" stroke-linecap="round"/></g>`:''}</g>`;
  if(st==='cur')s+=`<g class="mmas" transform="translate(${x>200?x-82:x+46} ${y-30})">${MINI_HEAD}</g>`;});
 return `<svg class="advmap" viewBox="0 0 ${W} ${H}" role="group" aria-label="خريطة الدروس">${s}</svg>`;}
function bindMap(root,fn){root.querySelectorAll('.mnode').forEach(g=>{g.onclick=()=>fn(g.dataset.k);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(g.dataset.k);}};});}
const starsTxt=n=>'★'.repeat(n)+'☆'.repeat(3-n);
